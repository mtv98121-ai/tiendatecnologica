
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <style>
       

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: linear-gradient(
            135deg,
            #fff7fb,
            #f2edff,
            #e9f7ff
        );
        color: #514767;
    }

    main {
        max-width: 800px;
        margin: 45px auto;
        padding: 50px 25px;
        text-align: center;
        background: linear-gradient(
            135deg,
            #fce4ed,
            #e6e1fa,
            #e3f3ff
        );
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(130, 100, 150, 0.12);
    }

    h1 {
        color: #7556a0;
        font-size: 34px;
    }

    p {
        color: #574477;
        line-height: 1.8;
        font-size: 18px;
    }

    @media (max-width: 600px) {
        main {
            padding: 35px 20px;
            margin: 20px auto;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>

  
</head>
<body>

    <main>
        <h1>⚡Bienvenidos!</h1>

        <p>
            Encuentra computadoras y accesorios tecnológicos
            para estudiar, trabajar y disfrutar.
        </p>

        <p>
            Explora nuestros productos y ofertas desde
            el menú superior.
        </p>
    </main>

</body>
</html>
